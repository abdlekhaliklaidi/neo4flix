spring.application.name=recommendation-service

server.port=8084

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=recommendation-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=recommendation_service.event
spring.kafka.consumer.properties.spring.json.value.default.type=recommendation_service.event.RatingEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false